name: ASENA APK Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Java kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v4

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Projeyi aç
        run: unzip -q ASENA_Android_Proje.zip

      - name: ASENA APK oluştur
        working-directory: AsenaAndroid
        run: gradle assembleDebug

      - name: APK dosyasını kaydet
        uses: actions/upload-artifact@v4
        with:
          name: ASENA-APK
          path: AsenaAndroid/app/build/outputs/apk/debug/app-debug.apk
          
